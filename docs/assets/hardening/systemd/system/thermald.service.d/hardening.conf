# thermald's job is writing sysfs knobs (cooling device states,
# intel_pstate and cpufreq limits, RAPL power caps, the INT3400 mode)
# spread across /sys/devices, so /sys as a whole stays writable and the
# procfs tunables are made read-only instead. As uid 0 it owns every
# file it touches, and its ioctls on /dev/acpi_thermal_rel (the ACPI
# thermal tables) are plain reads; the one capability it keeps is
# CAP_SYS_BOOT, for the reboot(RB_POWER_OFF) it issues when a CRITICAL
# trip point is reached (the HOT trip suspends through
# /sys/power/state). It keeps its pid file, user preferences and the
# generated config under /run/thermald, which survives a restart as it
# does today. Sockets: D-Bus and the kernel uevent netlink that delivers
# thermal zone events (without it thermald would not poll, it would go
# quiet), no IP. /dev/input carries the lid and tablet-mode switches
# its adaptive mode conditions on.
[Service]
CapabilityBoundingSet=CAP_SYS_BOOT
NoNewPrivileges=yes
RuntimeDirectory=thermald
RuntimeDirectoryPreserve=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
DevicePolicy=closed
DeviceAllow=/dev/acpi_thermal_rel rw
DeviceAllow=char-input r
ReadOnlyPaths=/proc/sys
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=strict
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictAddressFamilies=AF_UNIX AF_NETLINK
IPAddressDeny=any
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service @reboot
UMask=0077
