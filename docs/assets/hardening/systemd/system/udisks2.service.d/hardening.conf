# udisksd mounts removable media for the whole system, so it cannot
# live in a private mount namespace: systemd turns every mount
# namespace to slave propagation and mounts made inside would never
# reach the desktop. That rules out ProtectSystem, ProtectHome,
# PrivateTmp, the Protect* tunables and PrivateDevices. ProtectClock is
# also out because its implied DeviceAllow would switch the device
# policy on and cut the block devices off. What remains is the set of
# controls that do not need a namespace: the capabilities it actually
# exercises (mount and loop/dm ioctls, module loading through
# libblockdev, SG_IO for SMART, ownership of mount points, the real-uid
# switch for fstab entries with the user option), the two socket
# families it uses, native syscalls from the service set plus mount,
# module loading and swap activation, no privilege gain through exec
# (every helper it spawns runs as root already), and a private UTS
# namespace (openSUSE ships that one and RestrictRealtime for udisks2).
[Service]
CapabilityBoundingSet=CAP_SYS_ADMIN CAP_SYS_MODULE CAP_SYS_RAWIO CAP_DAC_OVERRIDE CAP_DAC_READ_SEARCH CAP_CHOWN CAP_FOWNER CAP_FSETID CAP_SETUID CAP_SETGID
NoNewPrivileges=yes
RestrictAddressFamilies=AF_UNIX AF_NETLINK
ProtectHostname=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service @mount @module @swap
SystemCallErrorNumber=EPERM
