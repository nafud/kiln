# One shot before basic.target: reads the settings and installs the
# blocking nftables ruleset over netlink, nothing else. Same binary as
# the daemon with a subset of its needs: CAP_NET_ADMIN, the log
# directory (as LogsDirectory so a deleted one is recreated, never a
# namespace failure), no tunnel device, no cgroup, no sysctl (those
# are set only when a tunnel comes up). It reads /etc/mullvad-vpn
# read-only through ProtectSystem.
[Service]
CapabilityBoundingSet=CAP_NET_ADMIN
NoNewPrivileges=yes
ProtectSystem=strict
LogsDirectory=mullvad-vpn
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=strict
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictAddressFamilies=AF_UNIX AF_NETLINK
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
IPAddressDeny=any
