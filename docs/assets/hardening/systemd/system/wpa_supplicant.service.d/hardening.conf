# wpa_supplicant runs as root for nl80211 (netlink) and EAPOL (packet
# sockets); those two are its whole privilege. It reads nothing outside
# /etc/wpa_supplicant and writes only its control sockets under
# /run/wpa_supplicant (the -O in ExecStart), which systemd now creates
# and removes; NetworkManager talks to it over D-Bus. systemd makes
# that directory writable by bind-mounting it over the read-only /run,
# so the rmdir wpa_supplicant tries on interface removal answers
# "Device or resource busy", one logged line and nothing more (measured
# 2026-08-31): the sockets themselves are unlinked and recreated fine. AF_INET stays
# only for the interface ioctls the driver code issues on a plain
# datagram socket; it sends no IP traffic itself, so IP traffic is
# denied outright. /dev/rfkill is opened read-only (NetworkManager does
# the writes). Kernel tunables are read-only except /proc/sys/net, where
# it sets per-interface frame filters on Hotspot 2.0 networks (a
# failure there is logged and ignored, but the knobs are its own to
# set).
[Service]
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW
NoNewPrivileges=yes
RuntimeDirectory=wpa_supplicant
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
DevicePolicy=closed
DeviceAllow=/dev/rfkill r
ProtectKernelTunables=yes
ReadWritePaths=/proc/sys/net
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=strict
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictAddressFamilies=AF_UNIX AF_NETLINK AF_PACKET AF_INET AF_INET6
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
IPAddressDeny=any
UMask=0077
