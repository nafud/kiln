# A bash loop around inotifywait on /.snapshots that runs
# /etc/grub.d/41_snapshots-btrfs (or a full grub-mkconfig) when a
# snapshot appears. That script mounts the btrfs top level read-only
# under a mktemp directory, lists subvolumes and rewrites
# /boot/grub/grub-btrfs.cfg; grub-probe opens the root and boot block
# devices and their parents (the whole disk, the LUKS partition)
# read-only and, because the root is dm-crypt, drives libdevmapper
# through /dev/mapper/control, which it opens read-write. So:
# CAP_SYS_ADMIN for mount(2), the btrfs tree search ioctls and the dm
# table queries; the mount itself stays inside the private namespace
# (it is unmounted before the script exits); /boot/grub is the only
# writable path; the two block device classes the disks belong to are
# reachable read-only, plus the dm control node. No network. With
# CAP_SYS_ADMIN and mount(2) retained the namespace is tidiness rather
# than a boundary; the capability and syscall limits are the boundary.
[Service]
CapabilityBoundingSet=CAP_SYS_ADMIN
NoNewPrivileges=yes
ProtectSystem=strict
ReadWritePaths=/boot/grub
ProtectHome=yes
PrivateTmp=yes
PrivateNetwork=yes
DevicePolicy=closed
DeviceAllow=block-device-mapper r
DeviceAllow=block-blkext r
DeviceAllow=/dev/mapper/control rw
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=strict
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictAddressFamilies=AF_UNIX
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service @mount
