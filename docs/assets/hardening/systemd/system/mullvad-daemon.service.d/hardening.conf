# The daemon needs root for the tunnel device, nftables, routes and
# policy rules, all of which are CAP_NET_ADMIN, plus CAP_NET_RAW for
# the raw ICMP sockets of its connectivity check. Its three directories
# are granted as ConfigurationDirectory/LogsDirectory/CacheDirectory,
# not ReadWritePaths: systemd creates a missing one before it builds
# the namespace, where a ReadWritePaths target that has been deleted
# (an uninstall once emptied /etc/mullvad-vpn's siblings) fails the
# unit at 226/NAMESPACE. The management socket is the file
# /run/mullvad-vpn itself, so /run as a whole is left writable (a
# narrower grant is not possible: the daemon unlinks and recreates the
# socket, and the GUI hardcodes the path). It sets two sysctls under
# /proc/sys/net/ipv4/conf/all (src_valid_mark for the fwmark policy
# routing, arp_ignore) and probes disable_ipv6 there, so /proc/sys/net
# stays writable while the rest of the tunables are read-only. Split
# tunnelling uses a cgroup v1 net_cls hierarchy; mullvad-net-cls.service
# provides that mount so the daemon needs neither CAP_SYS_ADMIN nor
# mount(2), and only that hierarchy is writable inside the otherwise
# read-only cgroup tree; the leading dash on its path keeps the daemon
# startable when the hierarchy is missing, degrading split tunnelling
# instead of failing namespace setup while the early boot blocker
# still holds its Blocked policy. The exclusions cgroup itself
# (talpid-cgroup's create_or_open_child: mkdir, EEXIST accepted) is
# made by the ExecStartPre below, whose "+" prefix runs it with full
# privileges and outside the namespace: a v1 hierarchy root is mode
# 555 like the cgroup2 root, so that mkdir needs CAP_DAC_OVERRIDE,
# which the daemon must not carry; sandboxed, it then only writes
# files it owns (net_cls.classid, cgroup.procs). Running at every
# start it needs no condition and no hand step. ProtectControlGroups
# must stay at yes: strict or private would mount a fresh cgroup2
# tree without the net_cls submount and push the daemon back into
# mounting it itself.
# DNS goes through systemd-resolved over D-Bus; the only thing it
# executes is lsb_release for the version string, which is absent here
# and tolerated.
[Unit]
Wants=mullvad-net-cls.service
After=mullvad-net-cls.service
[Service]
ExecStartPre=+/usr/bin/mkdir -p /sys/fs/cgroup/net_cls/mullvad-exclusions
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW
NoNewPrivileges=yes
ProtectSystem=strict
ConfigurationDirectory=mullvad-vpn
LogsDirectory=mullvad-vpn
CacheDirectory=mullvad-vpn
ReadWritePaths=/run
ProtectHome=yes
PrivateTmp=yes
DevicePolicy=closed
DeviceAllow=/dev/net/tun rw
ProtectKernelTunables=yes
ReadWritePaths=/proc/sys/net
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ReadWritePaths=-/sys/fs/cgroup/net_cls
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictAddressFamilies=AF_UNIX AF_NETLINK AF_INET AF_INET6
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
