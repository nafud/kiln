site_name: Kiln
site_description: Reverse Engineering Knowledge Base
site_url: https://nafud.github.io/kiln/
repo_url: https://github.com/nafud/kiln
repo_name: nafud/kiln

# Escalate link problems to warnings so `mkdocs build --strict` (run in CI
# on secondary) fails on them. The homepage is intentionally not in nav,
# so omitted_files stays at info.
validation:
  nav:
    omitted_files: info
    not_found: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite

theme:
  name: material
  logo: assets/images/kiln-logo-favicon.png
  favicon: assets/images/kiln-logo-favicon.png
  font: false
  icon:
    repo: material/link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.prune
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/page-utils.js
  - javascripts/page-chrome.js
  - javascripts/ascii-logo.js
  - javascripts/code-copy.js

plugins:
  - search

nav:
  - Books:
      - books/index.md
      - Modern x86 Assembly Language Programming:
          - books/mx86alp/index.md
          - Chapter 1: books/mx86alp/mx86alp-chapter-01.md
          - Chapter 6: books/mx86alp/mx86alp-chapter-06.md
      - Reverse Engineering for Beginners: books/re4b/index.md
      - Practical Reverse Engineering: books/pre/index.md
      - Practical Binary Analysis:
          - books/pba/index.md
          - Chapter 1: books/pba/pba-chapter-01.md
          - Chapter 2: books/pba/pba-chapter-02.md
          - Chapter 3: books/pba/pba-chapter-03.md
      - "Computer Systems: A Programmer's Perspective":
          - books/csapp/index.md
          - Chapter 3: books/csapp/csapp-chapter-03.md
          - Chapter 7: books/csapp/csapp-chapter-07.md
          - Chapter 8: books/csapp/csapp-chapter-08.md
          - Chapter 9: books/csapp/csapp-chapter-09.md

  - Tools:
      - tools/index.md
      - Radare2: tools/radare2/index.md

  - Courses:
      - courses/index.md
      - Investigating Windows Endpoints: courses/iwe/index.md
      - Investigating Windows Memory: courses/iwm/index.md
      - Investigating Linux Devices: courses/ild/index.md
      - Investigating macOS Endpoints: courses/ime/index.md

  - Writeups:
      - writeups/index.md
      - Crackmes.one:
          - writeups/crackmes-one/index.md
          - CFB1: writeups/crackmes-one/crackmes-one-cfb1.md
