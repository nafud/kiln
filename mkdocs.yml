site_name: Kiln
site_description: Reverse Engineering Knowledge Base
site_url: https://nafud.github.io/kiln/
repo_url: https://github.com/nafud/kiln
repo_name: nafud/kiln

# Escalate link problems to warnings so `mkdocs build --strict` (run in CI
# on secondary) fails on them. anchors covers the #fragment of cross-page
# links (the RE4B <-> challenges.re pairs), so a renamed heading fails CI
# instead of silently landing readers at the top of the page. The homepage
# is intentionally not in nav, so omitted_files stays at info.
validation:
  nav:
    omitted_files: info
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

theme:
  name: material
  custom_dir: overrides
  logo: assets/images/kiln-logo-favicon.png
  favicon: assets/images/kiln-logo-favicon.png
  font: false
  # The site's themes, light first (the default for new visitors); no
  # `media:` on any entry, so nothing follows the OS "auto" preference —
  # the site is deterministically light until the reader picks. The
  # header toggle button is hidden by extra.css — the t key (key-nav.js)
  # cycles these radios and the palette's :themes command lists them,
  # so the `toggle:` blocks exist to make Material render the radio
  # group, and each `toggle.name` is the theme's display name in the
  # :themes list. A theme's identity is its scheme+primary pair: light
  # themes use a custom scheme name (Material's own defaults live on
  # :root, so an unknown scheme inherits the stock light internals and
  # extra.css re-colors it through the --color-* tokens alone), while
  # dark themes ride `scheme: slate` with a distinct `primary` slug —
  # Material's entire dark kit (Pygments, admonitions) is scoped to
  # slate in palette.css, so a custom-named dark scheme would render
  # light code blocks on a dark ground.
  palette:
    - scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/toggle-switch
        name: light
    - scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/toggle-switch-off
        name: dark
    - scheme: tokyo-day
      primary: white
      accent: blue
      toggle:
        icon: material/toggle-switch
        name: tokyo day
    - scheme: slate
      primary: tokyo-night
      accent: blue
      toggle:
        icon: material/toggle-switch-off
        name: tokyo night
    - scheme: catppuccin-latte
      primary: white
      accent: blue
      toggle:
        icon: material/toggle-switch
        name: catppuccin latte
    - scheme: slate
      primary: phosphor
      accent: green
      toggle:
        icon: material/toggle-switch-off
        name: phosphor
    - scheme: slate
      primary: terminal
      accent: cyan
      toggle:
        icon: material/toggle-switch-off
        name: terminal
    - scheme: slate
      primary: nord
      accent: cyan
      toggle:
        icon: material/toggle-switch-off
        name: nord
    - scheme: slate
      primary: vesper
      accent: amber
      toggle:
        icon: material/toggle-switch-off
        name: vesper
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.prune
    # The footer itself is hidden by extra.css; this feature only exists
    # to put the per-page prev/next links into the DOM for key-nav.js.
    - navigation.footer
    - toc.follow
    - content.code.copy

extra_css:
  - stylesheets/extra.css

# page-utils.js must stay first (the shared KilnUtils global), and
# quick-jump.js must precede ascii-logo.js: their page-change hooks run
# in this order, so the homepage jump bar is in the DOM before the logo
# sizes itself against the article's remaining free height.
extra_javascript:
  - javascripts/page-utils.js
  - javascripts/external-links.js
  - javascripts/page-chrome.js
  - javascripts/quick-jump.js
  - javascripts/ascii-logo.js
  - javascripts/code-copy.js
  - javascripts/heading-shimmer.js
  - javascripts/key-nav.js
  - javascripts/widgets.js

# Material's search UI is hidden by extra.css (backtick opens the jump
# palette instead), but the plugin must stay: quick-jump.js searches the
# search_index.json this plugin emits.
plugins:
  - search

nav:
  - Guides:
      - guides/index.md
      - Radare2: guides/radare2/index.md
      - Volatility 3: guides/volatility3/index.md

  - Links: links/index.md

  - Books:
      - books/index.md
      - "Computer Systems: A Programmer's Perspective":
          - books/csapp/index.md
          - Chapter 3: books/csapp/csapp-chapter-03.md
          - Chapter 4: books/csapp/csapp-chapter-04.md
          - Chapter 7: books/csapp/csapp-chapter-07.md
          - Chapter 8: books/csapp/csapp-chapter-08.md
          - Chapter 9: books/csapp/csapp-chapter-09.md
      - Modern x86 Assembly Language Programming:
          - books/mx86alp/index.md
          - Chapter 1: books/mx86alp/mx86alp-chapter-01.md
          - Chapter 6: books/mx86alp/mx86alp-chapter-06.md
      - Practical Reverse Engineering:
          - books/pre/index.md
          - Chapter 1: books/pre/pre-chapter-01.md
          - Chapter 2: books/pre/pre-chapter-02.md
          - Chapter 3: books/pre/pre-chapter-03.md
      - Practical Binary Analysis:
          - books/pba/index.md
          - Chapter 1: books/pba/pba-chapter-01.md
          - Chapter 2: books/pba/pba-chapter-02.md
          - Chapter 3: books/pba/pba-chapter-03.md
      - Reverse Engineering for Beginners:
          - books/re4b/index.md
          - Chapter 1: books/re4b/re4b-chapter-01.md

  - Bookmarks: bookmarks/index.md

  - Courses:
      - courses/index.md
      - Investigating Windows Endpoints: courses/iwe/index.md
      - Investigating Windows Memory: courses/iwm/index.md
      - Investigating Linux Devices: courses/ild/index.md
      - Investigating macOS Endpoints: courses/ime/index.md

  - Writeups:
      - writeups/index.md
      - Crackmes.one:
          - writeups/crackmes-one/index.md
          - CFB1: writeups/crackmes-one/crackmes-one-cfb1.md
          - CFB2: writeups/crackmes-one/crackmes-one-cfb2.md
      - Challenges.re:
          - writeups/challenges-re/index.md
          - RE4B Chapter 1: writeups/challenges-re/challenges-re-re4b-ch01.md
      - Hack This Site:
          - writeups/hack-this-site/index.md
