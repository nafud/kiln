name: Build Check

on:
  push:
    branches:
      - secondary
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build (strict)
        run: mkdocs build --strict

      # Canary for Material theme internals that extra.css and the page
      # scripts hook into. Material offers no public API for these, so a
      # theme update can rename them without any build error — this step
      # turns that silent breakage into a red check on the bump PR.
      #   data-md-component="dialog"  extra.css hides the copy toast
      #   md-sidebar--primary,
      #   md-nav--primary,
      #   md-nav__title               extra.css sidebar styling + title fade
      #   md-main__inner              extra.css :has() homepage flex stretch
      #   md-content__inner           extra.css :has() homepage h1 hiding
      #   md-typeset, md-header       extra.css styling roots
      - name: Verify Material internals used by custom CSS/JS
        run: |
          # Hooks present in the built page HTML.
          for hook in \
            'data-md-component="dialog"' \
            'md-sidebar--primary' \
            'md-sidebar--secondary' \
            'md-sidebar__scrollwrap' \
            'md-search' \
            'md-logo' \
            '__palette' \
            'data-md-component="palette"' \
            '__drawer' \
            'md-nav--primary' \
            'md-nav__title' \
            'md-nav__list' \
            'md-nav__item' \
            'md-nav__link' \
            'md-main__inner' \
            'md-content__inner' \
            'md-typeset' \
            'md-header'; do
            grep -qF -- "$hook" site/index.html || {
              echo "::error::Material internal '$hook' is gone from the built HTML — a theme update likely renamed it. Update the overrides in docs/stylesheets/extra.css and the page scripts that hook it."
              exit 1
            }
          done

          # The 404 override (overrides/404.html) replaces Material's
          # site_nav and content template blocks; a block rename in a
          # Material update would silently restore the default 404 page.
          grep -qF -- 'kiln-404' site/404.html || {
            echo "::error::site/404.html lost the custom 404 markup — Material's 404.html or its content block likely changed. Update overrides/404.html."
            exit 1
          }
          if grep -qF -- 'md-sidebar' site/404.html; then
            echo "::error::site/404.html grew sidebars back — Material's site_nav block was likely renamed. Update overrides/404.html."
            exit 1
          fi

          # quick-jump.js builds its page list from the search plugin's
          # index; a plugin update that moves or renames it would break
          # the palette with no build error.
          test -s site/search/search_index.json || {
            echo "::error::site/search/search_index.json is missing — the search plugin stopped emitting it. Update the page-list fetch in docs/javascripts/quick-jump.js."
            exit 1
          }

          # overrides/main.html injects the pre-paint kiln-js script
          # through Material's extrahead block; a block rename in a
          # Material update would silently drop it (the homepage would
          # flash its fallback cards before the jump bar mounts).
          grep -qF -- 'kiln-js' site/index.html || {
            echo "::error::site/index.html lost the pre-paint kiln-js script — Material's extrahead block was likely renamed. Update overrides/main.html."
            exit 1
          }

          # key-nav.js follows the hidden footer's prev/next links for the
          # < / > page-switch keys (navigation.footer puts them in the DOM).
          grep -qF -- 'md-footer__link' site/books/index.html || {
            echo "::error::Material internal 'md-footer__link' is gone from the built HTML — a theme update likely renamed it or navigation.footer stopped emitting it. Update the page-switch keys in docs/javascripts/key-nav.js."
            exit 1
          }

          # The code-copy checkmark (extra.css + code-copy.js) hooks the
          # copy button, which Material injects at runtime, so it is not in
          # the page HTML — guard the tokens in the theme's CSS bundle instead.
          css=$(ls site/assets/stylesheets/main.*.min.css | head -1)
          for hook in 'md-code__button' 'data-md-type=copy' '--md-code-copy-icon'; do
            grep -qF -- "$hook" "$css" || {
              echo "::error::Material internal '$hook' is gone from the CSS bundle — a theme update likely renamed it. Update the copy-button checkmark in docs/stylesheets/extra.css / docs/javascripts/code-copy.js."
              exit 1
            }
          done
