name: Deploy MkDocs

on:
  push:
    branches:
      - primary
  workflow_dispatch: # manual re-deploy without an empty commit

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # workflow_dispatch offers a branch picker; production only ever
    # builds from primary, so a dispatch from any other ref is a no-op
    # instead of a rogue deploy.
    if: github.ref == 'refs/heads/primary'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build
        run: mkdocs build

      # Build stamp for the palette's :version command (quick-jump.js
      # fetches version.json; a local serve has none and reports a
      # local build).
      - name: Stamp build version
        run: |
          printf '{"commit":"%s","date":"%s"}' \
            "$(git rev-parse --short HEAD)" \
            "$(date -u '+%Y-%m-%d %H:%M UTC')" > site/version.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
